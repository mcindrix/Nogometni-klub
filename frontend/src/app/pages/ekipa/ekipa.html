<h2>Ekipe</h2>

@if (auth.admin()) {
  <div class="card">
    <h3>Dodaj ekipu</h3>
    <form class="inline-form" (ngSubmit)="dodaj()">
      <div class="field">
        <label>Naziv</label>
        <input name="naziv" [(ngModel)]="forma.Naziv" required />
      </div>
      <div class="field">
        <label>Liga</label>
        <input name="liga" [(ngModel)]="forma.Liga" />
      </div>
      <button type="submit">Dodaj</button>
    </form>
    @if (greska()) {
      <p class="error">{{ greska() }}</p>
    }
  </div>
}

<div class="card">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Naziv</th>
        <th>Liga</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (e of ekipe(); track e.EkipaID) {
        <tr>
          <td>{{ e.EkipaID }}</td>
          <td>{{ e.Naziv }}</td>
          <td>{{ e.Liga }}</td>
          <td>
            @if (auth.admin()) {
              <button class="danger" (click)="obrisi(e.EkipaID)">Obriši</button>
            }
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
