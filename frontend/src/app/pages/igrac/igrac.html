<h2>Igrači</h2>

<div class="card">
  <h3>Dodaj igrača</h3>
  <form class="inline-form" (ngSubmit)="dodaj()">
    <div class="field">
      <label>Ime</label>
      <input name="ime" [(ngModel)]="forma.Ime" required />
    </div>
    <div class="field">
      <label>Prezime</label>
      <input name="prezime" [(ngModel)]="forma.Prezime" required />
    </div>
    <div class="field">
      <label>Datum rođenja</label>
      <input type="date" name="datum" [(ngModel)]="forma.DatumRodjenja" />
    </div>
    <div class="field">
      <label>Pozicija</label>
      <select name="pozicija" [(ngModel)]="forma.PozicijaID" required>
        <option [ngValue]="undefined" disabled>-- odaberi --</option>
        @for (p of pozicije(); track p.PozicijaID) {
          <option [ngValue]="p.PozicijaID">{{ p.Naziv }}</option>
        }
      </select>
    </div>
    <div class="field">
      <label>Ekipa</label>
      <select name="ekipa" [(ngModel)]="forma.EkipaID">
        <option [ngValue]="null">-- bez ekipe --</option>
        @for (e of ekipe(); track e.EkipaID) {
          <option [ngValue]="e.EkipaID">{{ e.Naziv }}</option>
        }
      </select>
    </div>
    <button type="submit">Dodaj</button>
  </form>
  @if (greska()) {
    <p class="error">{{ greska() }}</p>
  }
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Ime</th>
        <th>Prezime</th>
        <th>Datum rođenja</th>
        <th>Pozicija</th>
        <th>Ekipa</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (i of igraci(); track i.IgracID) {
        <tr>
          <td>{{ i.IgracID }}</td>
          <td>{{ i.Ime }}</td>
          <td>{{ i.Prezime }}</td>
          <td>{{ i.DatumRodjenja }}</td>
          <td>{{ i.pozicija?.Naziv }}</td>
          <td>{{ i.ekipa?.Naziv ?? '-' }}</td>
          <td>
            @if (auth.admin()) {
              <button class="danger" (click)="obrisi(i.IgracID)">Obriši</button>
            }
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
