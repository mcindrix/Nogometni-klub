<h2>Stadioni</h2>

@if (auth.admin()) {
  <div class="card">
    <h3>Dodaj stadion</h3>
    <form class="inline-form" (ngSubmit)="dodaj()">
      <div class="field">
        <label>Naziv</label>
        <input name="naziv" [(ngModel)]="forma.Naziv" required />
      </div>
      <div class="field">
        <label>Grad</label>
        <input name="grad" [(ngModel)]="forma.Grad" required />
      </div>
      <div class="field">
        <label>Kapacitet</label>
        <input type="number" name="kapacitet" [(ngModel)]="forma.Kapacitet" />
      </div>
      <button type="submit">Dodaj</button>
    </form>
    @if (greska()) {
      <p class="error">{{ greska() }}</p>
    }
  </div>
}

<div class="card">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Naziv</th>
        <th>Grad</th>
        <th>Kapacitet</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (s of stadioni(); track s.StadionID) {
        <tr>
          <td>{{ s.StadionID }}</td>
          <td>{{ s.Naziv }}</td>
          <td>{{ s.Grad }}</td>
          <td>{{ s.Kapacitet }}</td>
          <td>
            @if (auth.admin()) {
              <button class="danger" (click)="obrisi(s.StadionID)">Obriši</button>
            }
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
